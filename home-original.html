<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="legacy-style.css"><link rel="stylesheet" href="legacy-figma.css"><link rel="stylesheet" href="paperlogy.css"><style>html,body{margin:0}main{max-width:none!important;margin:0!important;padding:0!important;min-height:100vh}.home{width:100%;max-width:430px;margin:auto}.home[hidden]{display:block!important}.home-summary[hidden]{display:none!important}dialog{max-width:92%;background:#ecd9b2;border:2px solid #633c23;padding:22px}dialog::backdrop{background:#21170ed9}dialog .catalog{display:grid;grid-template-columns:1fr 1fr;gap:15px}dialog .catalog p{line-height:1.7;font-size:14px}dialog .card-image{display:block;width:95px;margin:auto;background-image:url('assets/cards.webp')}dialog h3{font-size:19px}.catalog>article{border-bottom:1px solid #8a623c;padding:12px 0}</style></head><body><main><section id="home" class="home" aria-label="뱅 설명서 홈">

<div class="home-intro"><p>서부 개척 시대의 총격전 게임에서<br>정체를 숨기고, 내 편을 찾아 살아남으세요.<br>밑에서 인원 수를 고르시면 초심자를 위한 설명이 시작됩니다.</p></div>

</section></main><dialog id="catalog"><button id="close">닫기 ×</button><h2>카드 도감</h2><div class="catalog"></div></dialog><script src="home-original.js"></script></body></html>
